<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f3a" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Standard Catering" />
    <meta name="apple-mobile-web-app-title" content="Standard Catering" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="author" content="Standard Catering" />
    <meta name="creator" content="Standard Catering" />
    <meta name="publisher" content="Standard Catering" />
    <meta name="description" content="%%DESCRIPTION%%" />
    <meta name="robots" content="%%ROBOTS%%" />
    <link rel="canonical" href="%%CANONICAL%%" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preload" href="/fonts/DMSans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/DMSans-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/PlayfairDisplay-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Standard Catering" />
    <meta property="og:title" content="%%OG_TITLE%%" />
    <meta property="og:description" content="%%OG_DESCRIPTION%%" />
    <meta property="og:url" content="%%OG_URL%%" />
    <meta property="og:image" content="%%SITE_URL%%/og-image.png" />
    <meta property="og:image:secure_url" content="%%SITE_URL%%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Standard Catering — mobile catering, food trucks and live stations across Egypt" />
    <meta property="og:locale" content="en_EG" />
    <meta property="og:locale:alternate" content="ar_EG" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%OG_TITLE%%" />
    <meta name="twitter:description" content="%%OG_DESCRIPTION%%" />
    <meta name="twitter:image" content="%%SITE_URL%%/og-image.png" />
    <meta name="twitter:image:alt" content="Standard Catering — mobile catering, food trucks and live stations across Egypt" />

    %%EXTRA_JSONLD%%
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%%SITE_URL%%/#website",
            "url": "%%SITE_URL%%/",
            "name": "Standard Catering",
            "alternateName": ["Standard", "ستاندرد كاترينج"],
            "inLanguage": ["en", "ar-EG"],
            "publisher": { "@id": "%%SITE_URL%%/#business" }
          },
          {
            "@type": ["LocalBusiness", "FoodEstablishment", "CateringService"],
            "@id": "%%SITE_URL%%/#business",
            "name": "Standard Catering",
            "alternateName": "ستاندرد كاترينج",
            "url": "%%SITE_URL%%/",
            "logo": "%%SITE_URL%%/icons/icon-512.png",
            "image": "%%SITE_URL%%/og-image.png",
            "description": "Mobile event catering, food trucks, open buffets and live food stations for weddings, corporate events and celebrations across Egypt.",
            "telephone": "+201277711157",
            "email": "Standardcatering777@gmail.com",
            "priceRange": "$$",
            "areaServed": [
              { "@type": "City", "name": "Cairo" },
              { "@type": "City", "name": "Giza" },
              { "@type": "City", "name": "Alexandria" },
              { "@type": "Country", "name": "Egypt" }
            ],
            "sameAs": ["https://www.instagram.com/standard_egypt/"],
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+201277711157",
              "contactType": "customer service",
              "availableLanguage": ["Arabic", "English"]
            }
          },
          {
            "@type": "WebPage",
            "@id": "%%SITE_URL%%%%PAGE_PATH%%#webpage",
            "url": "%%OG_URL%%",
            "name": "%%OG_TITLE%%",
            "description": "%%OG_DESCRIPTION%%",
            "inLanguage": ["en", "ar-EG"],
            "isPartOf": { "@id": "%%SITE_URL%%/#website" },
            "about": { "@id": "%%SITE_URL%%/#business" }
          }
        ]
      }
    </script>
    <noscript><style>.reveal{opacity:1 !important;transform:none !important}</style></noscript>
    <title>%%PAGE_TITLE%%</title>
  </head>
  <body>
    <div id="root">%%RENDERED_BODY%%</div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
